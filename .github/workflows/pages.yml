name: Publish research portal and refresh fleet inventory
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - evidence/**
      - scripts/audit_fleet.py
      - scripts/audit_focus_sites.py
      - scripts/audit_feature_nodata.py
      - scripts/audit_context_buffer.py
      - scripts/audit_nine_site_lineage.py
      - scripts/audit_registry_witness.py
      - scripts/experiment_preflight.py
      - scripts/source_integrity.py
      - scripts/verify_s22.py
      - scripts/render_review_8e8d86f2.py
      - scripts/render_start_here.py
      - scripts/run_s23_tilta.py
      - scripts/verify_band06_and_units.py
      - scripts/verify_nine_site_leaders.py
      - scripts/render_s22_pages.py
      - scripts/render_olc91_portal.py
      - scripts/build_pages_site.py
      - scripts/render_portal.py
      - scripts/render_s16_portal.py
      - scripts/render_s17_portal.py
      - scripts/render_s19_portal.py
      - scripts/render_s20_pages.py
      - scripts/verify_s16.py
      - scripts/verify_s17.py
      - scripts/verify_s19.py
      - scripts/verify_s20.py
      - scripts/verify_current_artifact.py
      - scripts/verify_evidence.py
      - registry/**
      - vendor/gems57/**
      - src/gems91/readiness.py
      - src/gems91/novelty.py
      - src/gems91/omtj22.py
      - src/gems91/tilta23.py
      - src/gems91/capacity.py
      - .github/workflows/pages.yml
      - requirements.txt
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_mode: ${{ steps.pages_mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Detect Pages publisher mode without requiring admin permission
        id: pages_mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          case "$MODE" in legacy|workflow) ;; *) echo "Unsupported Pages build type: $MODE"; exit 1;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Pages build type is $MODE. Legacy mode deploys main:/ automatically; workflow mode uses the deploy job below."
      - name: Check every tracked artifact, including quarantined parallel outputs
        run: python scripts/check_artifact_policy.py
      - name: Refresh labelled GitHub source feed (no organizer scraping or experiments)
        run: python scripts/audit_fleet.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh nine-site source snapshots (partial failures remain explicit)
        continue-on-error: true
        run: python scripts/audit_focus_sites.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify current download identity and pinned-grid format
        run: |
          python scripts/verify_current_artifact.py
          python scripts/verify_s22.py
          python scripts/verify_evidence.py
          python scripts/verify_s16.py
          python scripts/verify_s17.py
          python scripts/verify_s19.py
          python scripts/verify_s20.py
      - run: python scripts/render_portal.py
      - name: Build static site with root and existing /docs/ URLs preserved
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R docs _site/docs
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        if: steps.pages_mode.outputs.mode == 'workflow'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_mode.outputs.mode == 'workflow'
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-source-feed
          path: |
            docs/fleet-audit.json
            docs/fleet-audit.csv
            docs/review-8e8d86f2/focus-inventory.json

  deploy:
    if: needs.build.outputs.pages_mode == 'workflow'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy verified research portal
        id: deployment
        uses: actions/deploy-pages@v4
