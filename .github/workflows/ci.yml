name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit, policy, published-byte and portal contract tests
        run: python -m pytest
      - name: Only registered prediction artifacts may be tracked
        run: python scripts/check_artifact_policy.py
      - name: Synthetic end-to-end legacy interface check (not a geological experiment)
        run: |
          make demo
          CAND=$(find tests/_tmp/releases -name '*.tif' ! -name '*zeros.tif' -print -quit)
          test -n "$CAND"
          python scripts/validate_release.py "$CAND" \
            --sample tests/_tmp/fixture/sample_submission.tif \
            --catalogue tests/_tmp/fixture/catalogue_mask.tif \
            --ledger ledger/submissions.csv
      - name: Source integrity and no conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- .; then
            echo '::error::Unresolved merge conflict'; exit 1
          fi
          python -m pytest tests/test_ced.py::test_shared_template_is_unmodified

  published-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore only the small pinned format reference and catalogue
        run: python scripts/restore_data.py --only sample_submission,existing_faults
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-read actual published TIFF and single-TIFF ZIP; never promote
        run: |
          python scripts/verify_frontdoor.py
          python scripts/verify_current_artifact.py --with-data
          python scripts/verify_evidence.py
          python scripts/verify_s16.py --with-data
          python scripts/verify_s17.py --with-data
          python scripts/verify_s19.py --with-data
      - name: Reinspect every TIFF and ZIP against pinned references
        run: |
          python scripts/audit_downloads.py --output "$RUNNER_TEMP/download-audit.json" --html "$RUNNER_TEMP/download-audit.html"
          diff -u docs/download-audit.json "$RUNNER_TEMP/download-audit.json"
          diff -u docs/download-audit.html "$RUNNER_TEMP/download-audit.html"
      - name: Evidence-derived portal is reproducible
        run: python -m pytest tests/test_submission_portal.py tests/test_s17_cpad.py tests/test_s19_svhf.py
      - uses: actions/upload-artifact@v4
        with:
          name: measured-research-evidence
          path: |
            docs/run-card.json
            docs/ced-*.json
            docs/run-card-S16.json
            docs/s16/
            docs/run-card-S17-CPAD.json
            docs/s17/
            docs/run-card-S19-SVHF.json
            docs/s19_svhf/
            docs/downloads/gems91-ced-*
            docs/downloads/gems91-s17-cpad-*
            docs/downloads/gems91-s19-svhf-*

# Deliberately no automatic multi-arm legacy rebuild or geological experiment.
# Legacy MODEL forecasts used incompatible instruments; format PASS isn't a
# promotion. The canonical experiment stopped at a literal registry duplicate.

  browser-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - run: npm ci --prefix tools/browser
      - name: Real download, desktop/mobile and accessibility checks
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R docs _site/docs
          python3 -m http.server 8000 --bind 0.0.0.0 --directory _site > "$RUNNER_TEMP/portal-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          PORTAL_BASE_URL=http://127.0.0.1:8000/docs/ PORTAL_ENTRY_URL=http://127.0.0.1:8000/ PORTAL_EXPECTED_ENTRY_URL=http://127.0.0.1:8000/docs/nine-site-audit-20261026.html node tools/browser/smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: portal-browser-verification
          path: work/browser-proof/
