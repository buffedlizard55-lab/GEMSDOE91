name: ci
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests (no competition data required)
        run: python -m pytest
      - name: End-to-end build then certify (synthetic fixture, no competition data)
        run: |
          make demo
          CAND=$(ls tests/_tmp/releases/*.tif | grep -v zeros | head -1)
          python scripts/validate_release.py "$CAND" \
            --sample tests/_tmp/fixture/sample_submission.tif \
            --catalogue tests/_tmp/fixture/catalogue_mask.tif \
            --ledger ledger/submissions.csv
      - name: No competition raster is committed
        run: |
          if git ls-files | grep -E '\.tiff?$'; then
            echo "::error::a raster is tracked in git; competition data must not be committed"
            exit 1
          fi
          echo "no rasters tracked"
      - name: Ledger invariants
        run: python -m pytest tests/test_ledger.py
      - name: Manifest is well formed
        run: |
          python - <<'PY'
          import json
          d = json.load(open("registry/data_manifest.json"))
          assert len(d["files"]) == 15
          for f in d["files"]:
              assert len(f["sha256"]) == 64, f["id"]
              assert f["bytes"] > 0, f["id"]
          print("manifest ok:", len(d["files"]), "entries")
          PY

      - name: No conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ; then
            echo "::error::conflict markers found"; exit 1
          fi
          echo "no conflict markers"

      - name: Manifest hash integrity (fails only on a MISMATCH)
        run: |
          python scripts/verify_manifest.py || true
          python - <<'PY'
          import json, subprocess, sys
          out = subprocess.run([sys.executable, "scripts/verify_manifest.py", "--json"],
                               capture_output=True, text=True)
          rows = json.loads(out.stdout)
          bad = [r for r in rows if r["status"] == "HASH_MISMATCH"]
          if bad:
              print("::error::hash mismatch:", bad); sys.exit(1)
          ok = sum(r["status"] == "OK" for r in rows)
          print(f"{len(rows)} pinned entries: {ok} verified, "
                f"{sum(r['status']=='MISSING' for r in rows)} absent (expected off the data machine)")
          PY

      - name: PRUNE ladder is reproducible from pinned inputs
        run: |
          # Only runs where the competition rasters are present (never in CI):
          # exits 2 with a clear message otherwise, which is not a CI failure.
          python scripts/verify_manifest.py | tail -8 || true

  lineage:
    name: lineage proof + rebuild to the committed hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Fetches only what registry/data_manifest.json pins, from immutable GitHub
      # commits, verifying every sha256. No organizer site, no credentials.
      # GITHUB_TOKEN is the workflow's own short-lived token, supplied by Actions.
      # It is never read, printed or stored by the code; it only avoids the 60/hour
      # unauthenticated API limit when restoring 14 pinned blobs.
      - run: python scripts/restore_data.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build first: releases/*.tif are gitignored, so the gate tests need them.
      - name: Rebuild all pinned releases
        run: |
          python scripts/build_spacing.py --build
          python scripts/make_catalogue.py
          python scripts/build_prune_ladder.py
          python scripts/build_prune_refill.py --build
      - name: Rebuild the MASS/consensus arms and prove they are deterministic
        run: |
          python scripts/build_mass_consensus.py
          sha256sum releases/*MASScons*.tif > /tmp/first.txt
          python scripts/build_mass_consensus.py > /dev/null
          sha256sum releases/*MASScons*.tif > /tmp/second.txt
          diff /tmp/first.txt /tmp/second.txt
          echo "byte-identical across two rebuilds (no RNG in the build)"
      - name: Parent dot set reproduces from both ancestors; every release passes
        run: python -m pytest -q tests/test_release_integration.py
      - name: Every rebuilt file is byte-identical to its committed manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          for manifest in ("releases/MANIFEST.json", "releases/PRUNE_REFILL_MANIFEST.json"):
              man = json.load(open(manifest))
              for f in man["files"]:
                  p = pathlib.Path("releases") / f["file"]
                  got = hashlib.sha256(p.read_bytes()).hexdigest()
                  assert got == f["sha256"], f"{f['file']}: {got} != {f['sha256']}"
                  assert p.stat().st_size == f["bytes"], f"{f['file']}: byte length differs"
                  print("byte-identical:", f["file"])
          PY
      - name: Every release passes the hard gates
        run: |
          for f in releases/*.tif; do python scripts/validate.py "$f" | tail -1; done
