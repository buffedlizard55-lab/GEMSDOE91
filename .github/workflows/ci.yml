name: ci
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests (no competition data required)
        run: python -m pytest
      - name: End-to-end build then certify (synthetic fixture, no competition data)
        run: |
          make demo
          CAND=$(ls tests/_tmp/releases/*.tif | grep -v zeros | head -1)
          python scripts/validate_release.py "$CAND" \
            --sample tests/_tmp/fixture/sample_submission.tif \
            --catalogue tests/_tmp/fixture/catalogue_mask.tif \
            --ledger ledger/submissions.csv
      - name: No competition raster is committed
        run: |
          if git ls-files | grep -E '\.tiff?$'; then
            echo "::error::a raster is tracked in git; competition data must not be committed"
            exit 1
          fi
          echo "no rasters tracked"
      - name: Ledger invariants
        run: python -m pytest tests/test_ledger.py
      - name: Manifest is well formed
        run: |
          python - <<'PY'
          import json
          d = json.load(open("registry/data_manifest.json"))
          assert len(d["files"]) == 15
          for f in d["files"]:
              assert len(f["sha256"]) == 64, f["id"]
              assert f["bytes"] > 0, f["id"]
          print("manifest ok:", len(d["files"]), "entries")
          PY
