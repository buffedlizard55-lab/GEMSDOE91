name: checks

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # The byte-exact R0 integration test intentionally needs 419 MB of
      # private-local pinned inputs; it is run in the sandbox, not downloaded
      # by CI or committed to this public repository.
      - run: pytest -q tests/test_r0_and_dti.py -k "not test_all_manifest_pins_and_exact_r0_rebuild"
